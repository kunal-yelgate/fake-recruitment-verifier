<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">TrueRecruit scan flow</title>
  <desc id="desc">A candidate submits a message, the API checks bounded public evidence, and the browser receives a transparent risk review.</desc>
  <rect width="1200" height="260" rx="24" fill="#141413"/>
  <g font-family="Arial, sans-serif">
    <text x="56" y="54" fill="#f37338" font-size="14" font-weight="700" letter-spacing="3">TRUERECRUIT / LOCAL DEMO FLOW</text>
    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="56" y="92" width="190" height="86" rx="16" fill="#f3f0ee"/>
      <text x="151" y="128" fill="#141413"><tspan x="151">Paste message</tspan><tspan x="151" dy="25" font-size="13" font-weight="400">browser input</tspan></text>
      <rect x="300" y="92" width="190" height="86" rx="16" fill="#f37338"/>
      <text x="395" y="128" fill="#141413"><tspan x="395">Validate + extract</tspan><tspan x="395" dy="25" font-size="13" font-weight="400">FastAPI boundary</tspan></text>
      <rect x="544" y="92" width="190" height="86" rx="16" fill="#f3f0ee"/>
      <text x="639" y="128" fill="#141413"><tspan x="639">Check signals</tspan><tspan x="639" dy="25" font-size="13" font-weight="400">public evidence</tspan></text>
      <rect x="788" y="92" width="150" height="86" rx="16" fill="#f37338"/>
      <text x="863" y="128" fill="#141413"><tspan x="863">Score</tspan><tspan x="863" dy="25" font-size="13" font-weight="400">deterministic</tspan></text>
      <rect x="992" y="92" width="152" height="86" rx="16" fill="#f3f0ee"/>
      <text x="1068" y="128" fill="#141413"><tspan x="1068">Review</tspan><tspan x="1068" dy="25" font-size="13" font-weight="400">evidence + advice</tspan></text>
    </g>
    <g stroke="#f37338" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M250 135h38m-8-8 8 8-8 8"/><path d="M494 135h38m-8-8 8 8-8 8"/>
      <path d="M738 135h38m-8-8 8 8-8 8"/><path d="M942 135h38m-8-8 8 8-8 8"/>
    </g>
    <text x="56" y="222" fill="#d1cdc7" font-size="13">Provider results are labelled live, partial, or demo; a score never proves that a recruiter is authentic.</text>
  </g>
</svg>
