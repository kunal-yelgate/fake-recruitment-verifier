repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        additional_dependencies:
          - fastapi==0.115.6
          - httpx==0.28.1
          - pydantic==2.10.6
          - pydantic-settings==2.7.1
          - PyJWT[crypto]==2.10.1
