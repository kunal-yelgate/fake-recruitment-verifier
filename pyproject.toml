[tool.ruff]
target-version = "py310"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E402", "E501", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"backend/app/signals/__init__.py" = ["F401", "UP035"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
files = ["backend/app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
disable_error_code = ["arg-type", "call-overload", "union-attr"]
exclude = ["backend/tests", "backend/benchmarks"]
